    <style>
        #h1 {
            color: black;
            text-align: center;
            font-size: 50px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: lightblue;
            color: white;
            font-family: 'Minecraft', sans-serif;
        }

        footer {
            margin-top: auto;
            background: #1f2a44;
            color: #f3f4f6;
            padding: 1rem 1.5rem;
            font-size: 0.9rem;
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            flex-shrink: 0;
            
        }

        .social-links {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            width: 100%;
            margin: 0.5rem 0 1rem;
        }

        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
        }

        .social-links svg {
            width: 76px;
            height: 76px;
        }

        .discord-servers {
            display: grid;
            grid-template-columns: repeat(2, 300px);
            gap: 1rem;
            margin: 0 auto;
        }

        .community-content {
            margin: auto;
        }

        .visitor-count {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: #1f2a44;
            margin: 0;
            text-align: left;
            font-size: 26px;
        }

        .discord-server {
            background-color: #1f2a44;
            color: white;
            width: 300px;
            height: 130px;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Minecraft', sans-serif;
            border-radius: 1000px;
        }

        .discord-server:hover{
            cursor: pointer;
        }

        a {
        text-decoration: none;
        }

        @media (max-width: 650px) {
            .discord-servers {
                grid-template-columns: minmax(0, 300px);
            }
        }
    </style>

    <footer>© 2026 EinZettel Community</footer>

    <script>
        const visitorCount = document.getElementById("visitor-count");
        const getDateKey = (date) => [
            date.getFullYear(),
            String(date.getMonth() + 1).padStart(2, "0"),
            String(date.getDate()).padStart(2, "0")
        ].join("-");

        try {
            const storageKey = "einzettel-community-last-visit";
            let countedDate = getDateKey(new Date());

            if (localStorage.getItem(storageKey) !== countedDate) {
                localStorage.setItem(storageKey, countedDate);
            }

            visitorCount.textContent = "Besucher heute: 1";

            const resetAtMidnight = () => {
                const now = new Date();
                const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);

                window.setTimeout(() => {
                    const currentDate = getDateKey(new Date());

                    if (currentDate !== countedDate) {
                        countedDate = currentDate;
                        visitorCount.textContent = "Besucher heute: 0";
                    }

                    resetAtMidnight();
                }, nextMidnight.getTime() - now.getTime());
            };

            resetAtMidnight();
        } catch (error) {
            console.error("Der heutige Besuch konnte nicht gespeichert werden.", error);
            visitorCount.textContent = "Besucherzähler ist in diesem Browser nicht verfügbar.";
        }
    </script>
